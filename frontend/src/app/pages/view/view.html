<div class="page">
  <div class="container">
    <h1>Read now</h1>

    <div class="form">
      @if (error) {
        <div class="err">error: {{ error }}</div>
      }

      @if (content === null) {
        @if (needsPassword) {
          <p>
            <label>Password<br>
              <input [(ngModel)]="password" type="password" class="in" autocomplete="current-password">
            </label>
          </p>
        }
        <button class="btn" (click)="open()" [disabled]="loading">open</button>
      } @else {
        <pre class="note">{{ content }}</pre>
      }
    </div>
  </div>
</div>
