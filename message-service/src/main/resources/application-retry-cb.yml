outbox:
  retry:
    enabled: true
    base-delay-seconds: 2    # delay = 2^attempt s ...
    max-delay-seconds: 60    # ... capped at 60 s
    max-attempts: 20

resilience4j:
  circuitbreaker:
    instances:
      auditService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s