events {}

http {
    include /etc/nginx/mime.types;

    upstream message_services {
        server message-service-1:8080;
        server message-service-2:8080;
    }

    server {
        listen 80;

        # API -> load-balanced message-service instances
        location /api/ {
            proxy_pass http://message_services;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Angular UI (static). Unknown paths such as /p/<id> fall back to
        # index.html so the client-side router can handle them.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
        }
    }
}
